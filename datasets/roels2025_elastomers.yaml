# Roels, Costa Cornella, Brancart (Vrije Universiteit Brussel): "A Standardized Framework for Elastomer
# Characterization in Soft Robotics", Advanced Intelligent Systems (2025), doi:10.1002/aisy.202500699.
# Data: Zenodo doi:10.5281/zenodo.14983287, CC-BY-4.0. Not redistributed: `softsim fetch` downloads the
# three archives used here into local_dir (gitignored).
#
# Per material: uniaxial tension (several specimens, to rupture), uniaxial compression (several
# specimens, to 25%) and one stress relaxation in compression (ramp to ~30% in ~0.7 s, ~0.4/s, then a 3 h
# hold, sampled at 1 kHz). In the relaxation recordings the stress peaks ~0.3 s after the strain reaches
# its target (machine or load-cell lag), so only the hold from the stress peak on is used. Tension and
# compression strain rates are not in the files; the paper gives the protocol. Room temperature.
# Moduli here are ~3x those of the Soft Robotics Materials Database (marechal2021_srmd), whose strain
# came from the crosshead; for Ecoflex 00-30 at 100% strain: 93 kPa here, 30 kPa there, 69 kPa datasheet.
kind: material_tests
name: roels2025_elastomers
title: A standardized elastomer characterization framework for soft robotics (accompanying dataset)
authors: [Ellen Roels, Aleix Costa Cornella, Joost Brancart]
doi: 10.5281/zenodo.14983287
paper_doi: 10.1002/aisy.202500699
license: CC-BY-4.0
url: https://zenodo.org/records/14983287
local_dir: data/raw/roels2025
format: xy_csv
sources:
  tension: {url: "https://zenodo.org/api/records/14983287/files/Uniaxial%20tension.zip/content", file: Uniaxial tension.zip,
            md5: 961fdf0eb7650941fcadf53b8650887d, member_prefix: Uniaxial tension/}
  compression: {url: "https://zenodo.org/api/records/14983287/files/Uniaxial%20compression.zip/content", file: Uniaxial compression.zip,
                md5: 1d445b2cc7a2393e62b8017f69710ca0, member_prefix: Uniaxial compression/}
  relaxation: {url: "https://zenodo.org/api/records/14983287/files/Stress%20relaxation.zip/content", file: Stress relaxation.zip,
               md5: 95a66a75f896c6b6653be2299d5e47a8, member_prefix: Stress relaxation/}
conditions:
  mode: uniaxial
  temperature: room temperature
  strain_measurement: see the paper (tension to rupture, compression to 25%)
materials:
  dragon_skin_20:
    product: Smooth-On Dragon Skin 20
    tests:
      - {source: tension, kind: tension, members: ['Dragon Skin 20 - 1.csv', 'Dragon Skin 20 - 2.csv', 'Dragon Skin 20 - 3.csv', 'Dragon Skin 20 - 4.csv']}
      - {source: compression, kind: compression, members: ['Dragon Skin 20 - 1.csv', 'Dragon Skin 20 - 2.csv', 'Dragon Skin 20 - 3.csv', 'Dragon Skin 20 - 4.csv', 'Dragon Skin 20 - 5.csv', 'Dragon Skin 20 - 6.csv']}
      - {source: relaxation, kind: relaxation, members: ['Dragon Skin 20-relaxation.csv']}
  dragon_skin_30:
    product: Smooth-On Dragon Skin 30
    tests:
      - {source: tension, kind: tension, members: ['Dragon Skin 30 - 1.csv', 'Dragon Skin 30 - 2.csv', 'Dragon Skin 30 - 3.csv', 'Dragon Skin 30 - 4.csv']}
      - {source: compression, kind: compression, members: ['Dragon Skin 30 - 1.csv', 'Dragon Skin 30 - 3.csv', 'Dragon Skin 30 - 4.csv', 'Dragon Skin 30 - 5.csv', 'Dragon skin 30 - 2.csv']}
      - {source: relaxation, kind: relaxation, members: ['Dragon Skin 30-relaxation.csv']}
  ecoflex_00_20:
    product: Smooth-On Ecoflex 00-20
    tests:
      - {source: tension, kind: tension, members: ['Ecoflex 00-20 - 1.csv', 'Ecoflex 00-20 - 10.csv', 'Ecoflex 00-20 - 2.csv', 'Ecoflex 00-20 - 3.csv', 'Ecoflex 00-20 - 4.csv', 'Ecoflex 00-20 - 5.csv', 'Ecoflex 00-20 - 6.csv', 'Ecoflex 00-20 - 7.csv', 'Ecoflex 00-20 - 8.csv', 'Ecoflex 00-20 - 9.csv']}
      - {source: compression, kind: compression, members: ['Ecoflex 00-20 - 1.csv', 'Ecoflex 00-20 - 2.csv', 'Ecoflex 00-20 - 3.csv']}
      - {source: relaxation, kind: relaxation, members: ['Ecoflex 00-20-relaxation.csv']}
  ecoflex_00_30:
    product: Smooth-On Ecoflex 00-30
    density: 1070 kg/m^3
    density_source: Smooth-On datasheet (specific gravity 1.07)
    tests:
      - {source: tension, kind: tension, members: ['Ecoflex 00-30 - 1.csv', 'Ecoflex 00-30 - 2.csv', 'Ecoflex 00-30 - 3.csv']}
      - {source: compression, kind: compression, members: ['Ecoflex 00-30 - 1.csv', 'Ecoflex 00-30 - 2.csv', 'Ecoflex 00-30 - 3.csv', 'Ecoflex 00-30 - 4.csv', 'Ecoflex 00-30 - 5.csv']}
      - {source: relaxation, kind: relaxation, members: ['Ecoflex 00-30-relaxation.csv']}
  ecoflex_00_50:
    product: Smooth-On Ecoflex 00-50
    tests:
      - {source: tension, kind: tension, members: ['Ecoflex 00-50 - 1.csv', 'Ecoflex 00-50 - 2.csv', 'Ecoflex 00-50 - 3.csv', 'Ecoflex 00-50 - 4.csv', 'Ecoflex 00-50 - 5.csv', 'Ecoflex 00-50 - 6.csv']}
      - {source: compression, kind: compression, members: ['Ecoflex 00-50 - 1.csv', 'Ecoflex 00-50 - 2.csv', 'Ecoflex 00-50 - 3.csv']}
      - {source: relaxation, kind: relaxation, members: ['Ecoflex 00-50-relaxation.csv']}
  mold_max_14nv:
    product: Smooth-On Mold Max 14NV
    tests:
      - {source: tension, kind: tension, members: ['Mold Max 14NV - 1.csv', 'Mold Max 14NV - 2.csv', 'Mold Max 14NV - 3.csv', 'Mold Max 14NV - 4.csv']}
      - {source: compression, kind: compression, members: ['Mold Max 14 NV - 3.csv', 'Mold Max 14NV - 1.csv', 'Mold Max 14NV - 2.csv', 'Mold Max 14NV - 4.csv', 'Mold Max 14NV - 5.csv']}
      - {source: relaxation, kind: relaxation, members: ['Mold Max 14NV-relaxation.csv']}
  mold_star_30:
    product: Smooth-On Mold Star 30
    tests:
      - {source: tension, kind: tension, members: ['Mold Star 30 - 1.csv', 'Mold Star 30 - 2.csv', 'Mold Star 30 - 3.csv', 'Mold Star 30 - 4.csv', 'Mold Star 30 - 5.csv']}
      - {source: compression, kind: compression, members: ['Mold Star 30 - 1.csv', 'Mold Star 30 - 2.csv', 'Mold Star 30 - 3.csv', 'Mold Star 30 - 4.csv']}
      - {source: relaxation, kind: relaxation, members: ['Mold Star 30-relaxation.csv']}
