# Cable-bent cantilever: the verification case for cable actuation
# (docs/actuation.md). A 10 x 10 x 60 mm beam clamped at its base, no gravity,
# with a cable 3 mm off its axis (+x), anchored 5 mm below the top face (a
# point anchor on the face would dent it and spoil the tilt measured there).
# The cable's tension T puts a pure moment M = T d on the beam below the anchor,
# so Euler-Bernoulli gives a circular arc with tip angle theta = T d L / (E I),
# L = 55 mm, at any rotation: 0.28 rad at 0.7 N. The tension follows a smooth
# (quintic) ramp over 400 ms, slow next to the beam's ~10 Hz first mode, and is
# then held.
#   softsim run scenarios/actuation/cable_cantilever.yaml --backend mujoco
#   softsim run scenarios/actuation/cable_cantilever.yaml --backend fem --set simulation.timestep=2ms
scenario: actuation
description: Cable-bent cantilever (10 x 10 x 60 mm, E = 500 kPa), 0-0.7 N.
backend: mujoco

simulation:
  timestep: 0.1 ms
  duration: 500 ms
  output_rate: 1 kHz
  gravity: [0, 0, 0]

ground:
  enabled: false

body:
  name: beam
  geometry: {type: box, size: [10 mm, 10 mm, 60 mm]}
  material:
    density: 1070 kg/m^3
    elastic: {model: stable_neo_hookean, youngs_modulus: 500 kPa, poisson_ratio: 0.45}
  mesh: {size: 2 mm, method: structured}
  fixed: [base]

actuators:
  - name: cable
    type: cable
    path: [[3 mm, 0 mm, 0 mm], [3 mm, 0 mm, 55 mm]]
    schedule: [[0 ms, 0 N], [25 ms, 0.0016 N], [50 ms, 0.0112 N], [75 ms, 0.0341 N], [100 ms, 0.0725 N],
               [125 ms, 0.1260 N], [150 ms, 0.1926 N], [175 ms, 0.2688 N], [200 ms, 0.3500 N],
               [225 ms, 0.4312 N], [250 ms, 0.5074 N], [275 ms, 0.5740 N], [300 ms, 0.6275 N],
               [325 ms, 0.6659 N], [350 ms, 0.6888 N], [375 ms, 0.6984 N], [400 ms, 0.7000 N],
               [500 ms, 0.7000 N]]
