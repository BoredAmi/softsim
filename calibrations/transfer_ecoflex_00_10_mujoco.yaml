# Transfer of the physical Ecoflex 00-10 card to MuJoCo: which MuJoCo parameters (5 mm linear tets,
# nu = 0.45 against locking, Prony on the flex) reproduce the locking-free 3D reference?
# The "experiment" here is the reference run of the physical card with each recording's measured
# impact (python tools/make_reference_tracks.py), so the fitted values are MuJoCo's effective card
# for that physical card and the remaining NRMSE is MuJoCo's error bar against the reference.
#   softsim calibrate calibrations/transfer_ecoflex_00_10_mujoco.yaml --jobs 2      (~5 min)
dataset: ../datasets/czopek2026_ecoflex_drop.yaml
tracks: ../runs/reference_tracks/ecoflex_00_10_physical
cases: {w020: 1.0, w050: 1.0}
overrides:
  - backend=mujoco
  - "specimen.material={name: ecoflex_00_10_physical, density: 1040, elastic: {model: stable_neo_hookean, youngs_modulus: 143 kPa, poisson_ratio: 0.45}, damping: {model: prony, g: [0.69], tau: [2 ms]}, friction: {sliding: 1.0}}"
  - specimen.mesh.size=0.005
  - simulation.timestep=0.00003
  - simulation.duration=0.012
  - simulation.output_rate=10000
  - output.save_model=false
parameters:
  specimen.material.elastic.youngs_modulus: {initial: 143 kPa, bounds: [30 kPa, 600 kPa], log: true}
  specimen.material.damping.g[0]: {initial: 0.69, bounds: [0.05, 0.95], log: false}
  specimen.material.damping.tau[0]: {initial: 2 ms, bounds: [0.1 ms, 50 ms], log: true}
max_evaluations: 40
output: ../runs/calibration/transfer_ecoflex_00_10_mujoco
