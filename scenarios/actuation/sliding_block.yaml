# Sliding block: the friction benchmark (docs/actuation.md). A 40 x 40 x 10 mm silicone block (17.1 g) rests on
# the ground (friction 0.5 on both sides, so every backend's combination rule gives 0.5) and is pushed along +x by a
# force spread over its top face, ramped to 0.12 N in 50 ms and held. Coulomb's law: the block sticks while
# F < mu m g (0.084 N), then slides with a = (F - mu m g) / m; the top face's travel along x after 300 ms is
# softsim.analytic.sliding_block_travel (69.8 mm), plus the block's small shear (~0.1 mm). Too low to tip:
# tipping would need F / (m g) > w / (2 h) = 2.
#   softsim run scenarios/actuation/sliding_block.yaml --backend mujoco
scenario: actuation
description: Silicone block pushed across the ground, friction 0.5, 0.12 N (Coulomb sliding).
backend: mujoco

simulation:
  timestep: 0.1 ms
  duration: 300 ms
  output_rate: 1 kHz

ground:
  friction: {sliding: 0.5}

body:
  name: block
  geometry: {type: box, size: [40 mm, 40 mm, 10 mm]}
  material:
    density: 1070 kg/m^3
    elastic: {model: stable_neo_hookean, youngs_modulus: 200 kPa, poisson_ratio: 0.45}
    friction: {sliding: 0.5}
  mesh: {size: 5 mm, method: structured}

actuators:
  - name: push
    type: force
    region: top
    direction: [1, 0, 0]
    schedule: [[0 ms, 0 N], [50 ms, 0.12 N], [300 ms, 0.12 N]]
