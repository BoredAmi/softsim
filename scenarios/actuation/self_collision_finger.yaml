# Self-collision check (docs/actuation.md#a-body-that-touches-itself): a 30 x 12 x 6 mm Ecoflex 00-30 cable finger
# with two links and one 2 mm slot, its tendon pulled to 0.6 N, which closes the slot completely. The gauge `slot`
# (`body.gaps`) is the signed gap between the slot's two walls (regions slot1_lower, slot1_upper): negative is one wall
# inside the other. With `body.self_collision: true` the walls must stay apart (measured min gap +0.19 mm on MuJoCo,
# +0.10 mm on SOFA); with it off they pass through each other (-1.3 to -1.4 mm), so the check can fail. fem and rod
# refuse self-collision. The cable spacing is 5 mm to keep the explicit cable force stable at a coarse time step.
#   softsim run scenarios/actuation/self_collision_finger.yaml
#   softsim run scenarios/actuation/self_collision_finger.yaml --set body.self_collision=false     # walls pass through
#   softsim run scenarios/actuation/self_collision_finger.yaml --backend sofa --set simulation.timestep=0.5ms
#   python -m pytest tests/test_self_collision.py
scenario: actuation
description: Two-link cable finger pulled until its slot closes; the slot's walls collide (self-collision).
backend: mujoco

simulation:
  timestep: 0.1 ms
  duration: 200 ms
  output_rate: 200 Hz
  gravity: [0, 0, 0]
  iterations: 300

ground:
  enabled: false

body:
  name: finger
  geometry: {type: cable_finger, length: 30 mm, width: 12 mm, depth: 6 mm, segments: 2,
             slot_width: 2 mm, slot_depth: 4 mm, tendon_offset: 5 mm}
  material: {preset: ecoflex_00_30, damping: null}
  mesh: {size: 2 mm, method: gmsh}
  fixed: [base]
  self_collision: true
  gaps:
    - {name: slot, between: [slot1_lower, slot1_upper]}

actuators:
  - name: cable
    type: cable
    path: geometry
    anchor: top
    spacing: 5 mm
    schedule: [[0 ms, 0 N], [120 ms, 0.6 N], [200 ms, 0.6 N]]
